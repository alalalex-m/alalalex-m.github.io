<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pics_kissie.mov 播放链接</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: radial-gradient(circle at top, #ffd8f0, #ffe8d1 40%, #fde4ff 70%, #fef6ff);
        --card-bg: rgba(255, 255, 255, 0.85);
        --text: #232133;
        --accent: #f471b5;
        --accent-dark: #e952a3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        color: var(--text);
      }

      .card {
        width: min(520px, 100%);
        background: var(--card-bg);
        border-radius: 32px;
        padding: 2.5rem;
        box-shadow: 0 25px 70px rgba(244, 113, 181, 0.25);
        backdrop-filter: blur(18px);
        text-align: center;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        letter-spacing: 0.04em;
      }

      p {
        margin: 0 0 1.5rem;
        line-height: 1.6;
        color: #615870;
      }

      .preview {
        width: 100%;
        border-radius: 24px;
        overflow: hidden;
        margin-bottom: 1.8rem;
        border: 2px dashed rgba(244, 113, 181, 0.4);
        background: rgba(255, 255, 255, 0.6);
      }

      video {
        width: 100%;
        display: block;
      }

      a.cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
        color: white;
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        padding: 0.95rem 1.8rem;
        border-radius: 999px;
        box-shadow: 0 15px 40px rgba(244, 113, 181, 0.35);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      a.cta:hover {
        transform: translateY(-2px) scale(1.01);
        box-shadow: 0 20px 45px rgba(244, 113, 181, 0.4);
      }

      small {
        display: block;
        margin-top: 1.2rem;
        color: #8d839c;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Pics_kissie.mov</h1>
      <p>点击下方按钮，即可在线播放这段视频文件。</p>
      <div class="preview">
        <video src="Pics_kissie.mov" controls playsinline preload="metadata"></video>
      </div>
      <a class="cta" href="Pics_kissie.mov" target="_blank" rel="noopener">
        ▶️ 立即播放
      </a>
      <small>若无法自动播放，请确保已将视频文件部署到 GitHub Pages。</small>
    </main>
  </body>
</html>
